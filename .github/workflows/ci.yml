# Pruebas y compilación en Windows, Linux y macOS.
# En cada push a main, en cada pull request o a mano (pestaña Actions › Run workflow):
#   1. busca avisos de seguridad en las dependencias de Rust con cargo-deny (ver deny.toml);
#   2. corre ./test.sh (pruebas de Rust y de la interfaz);
#   3. compila la app y sube los instaladores como artefactos del run, para descargarlos
#      desde la página del run en GitHub (se borran a los 14 días).
# Además, cada lunes repite solo el paso 1: salen avisos nuevos aunque el código no cambie.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # lunes, 9:00 UTC

# Un push nuevo cancela el run anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilidades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  app:
    name: app (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false # que un fallo en un sistema no cancele los demás
      matrix:
        include:
          # Ubuntu 22.04 y no la más reciente: un AppImage solo corre en sistemas con una glibc
          # igual o más nueva que la de donde se compiló.
          - os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            files: |
              target/release/bundle/nsis/*.exe
              target/release/atalanta.exe
          # macos-latest es Apple Silicon: la app solo corre en Macs M1 o más nuevos.
          - os: macos-latest
            bundles: app,dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # también en Windows (Git Bash), para usar ./test.sh tal cual
    steps:
      - uses: actions/checkout@v4

      # Lo que Tauri necesita en Linux: WebKitGTK (la vista web) y las herramientas del AppImage.
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # guarda lo compilado entre runs
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: ./test.sh

      # La CLI de Tauri desde npm (ya compilada; `cargo install tauri-cli` tardaría minutos).
      - name: Compilar
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }}
        env:
          # macOS: firma "ad hoc" (sin cuenta de Apple Developer). Sin firma, macOS dice que la
          # app descargada "está dañada"; así solo avisa que es de un desarrollador no identificado.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: Atalanta-${{ runner.os }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
